name: GremiosGUI
version: '${project.version}'
main: com.etheria.gremios.GremiosPlugin
api-version: '1.21'
authors: [Etheria]
description: Gremios, territorios, raids con asedio, banco, impuestos y menús con resourcepack.
softdepend: [PlaceholderAPI]

commands:
  gremio:
    description: Menú y comandos de tu gremio.
    aliases: [g, guild, gremios]
    usage: /gremio [ayuda]
  territorio:
    description: Administración de territorios (admin).
    aliases: [terr]
    usage: /territorio <varita|crear|borrar|lista|info|precio|setspawn|setnodo|npc|snapshot|reset|liberar|tp>
  gremioadmin:
    description: Administración del sistema de gremios (admin).
    aliases: [gadmin]
    usage: /gremioadmin <moneda|permitir|quitar|bypass|dar|raid|xp|banco|disolver|reload|panel>
  gremioxp:
    description: Da XP de gremio (consola / misiones).
    usage: /gremioxp dar <jugador> <cantidad> [rep]

permissions:
  gremios.admin:
    description: Administrar gremios y territorios.
    default: op
  gremios.crear:
    description: Permite fundar un gremio.
    default: false
  gremios.usar:
    description: Usar el sistema de gremios.
    default: true
